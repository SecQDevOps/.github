name: pre-commit

# Reusable org-wide workflow: runs the repo's pre-commit hooks (pre-commit stage:
# hygiene, secrets, formatting) across all files. Complements — does not replace —
# each repo's language lint/type/test jobs. Call it from a repo's ci.yml with:
#   pre-commit:
#     uses: SecQDevOps/.github/.github/workflows/pre-commit.yml@main
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      # Toolchains for the local format hooks, installed only when relevant.
      - if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - if: ${{ hashFiles('go.mod') != '' }}
        run: |
          go install mvdan.cc/gofumpt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      # Cache the hook environments (pre-commit/action did this for us); we run
      # pre-commit directly so we can render a readable summary of hook results.
      #
      # Restored on every run, saved only from the default branch. The cache is
      # 1.1-1.6 GB, and GitHub scopes a cache to the branch that saved it, so
      # saving from every PR branch uploaded a fresh copy per branch. On the
      # self-hosted runners one save took 18 minutes, holding the runner the
      # whole time, and the reducer's copies pushed it past the 10 GB per-repo
      # limit, where evictions force yet more uploads. A PR branch restores the
      # default branch's copy instead; until main has saved one, it installs the
      # hooks itself and keeps them for the job only.
      - id: pre-commit-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (+ job summary)
        run: |
          set +e
          # Create and activate a venv to bypass Debian's global pip restrictions
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure 2>&1 | tee out.txt
          CODE=${PIPESTATUS[0]}
          {
            echo "## 🪝 pre-commit — hygiene, secrets, formatting"
            if [ "$CODE" -eq 0 ]; then
              echo "✅ All hooks passed."
            else
              echo "❌ One or more hooks failed (some may have auto-fixed files locally)."
              echo ""
              echo "| Hook | Result |"
              echo "|:--|:--|"
              sed -E 's/\x1b\[[0-9;]*m//g' out.txt \
                | grep -E '\.\.\.*(Passed|Failed|Skipped)$' \
                | sed -E 's/^(.*[^.])\.+(Passed|Failed|Skipped)$/| \1 | \2 |/' | head -50
              echo ""
              echo "<details><summary>Full output</summary>"; echo ""; echo '```'
              sed -E 's/\x1b\[[0-9;]*m//g' out.txt | tail -c 30000
              echo '```'; echo ""; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"

      # Only a push to the default branch writes the cache, and only when the
      # restore above missed: an exact hit means this key is already stored.
      - if: >-
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && steps.pre-commit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.pre-commit-cache.outputs.cache-primary-key }}

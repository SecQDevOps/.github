# Reusable release-please workflow (Conventional-Commits -> version bump PR -> tag + Release).
# Each repo calls this from its own .github/workflows/release.yml and reads its
# release-please-config.json / .release-please-manifest.json (manifest mode).
name: release-please

on:
  workflow_call:
    outputs:
      release_created:
        description: "true (string) when merging the release PR cut a new release"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "Tag of the new release, e.g. v0.2.0"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "Semver of the new release without the leading v, e.g. 0.2.0"
        value: ${{ jobs.release-please.outputs.version }}
      major:
        value: ${{ jobs.release-please.outputs.major }}
      minor:
        value: ${{ jobs.release-please.outputs.minor }}
      patch:
        value: ${{ jobs.release-please.outputs.patch }}
      sha:
        description: "Commit SHA the release was tagged on"
        value: ${{ jobs.release-please.outputs.sha }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      major: ${{ steps.rp.outputs.major }}
      minor: ${{ steps.rp.outputs.minor }}
      patch: ${{ steps.rp.outputs.patch }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # release-please bumps the version in pyproject.toml but knows nothing
      # about uv.lock, which pins the project's own version too. Left alone, the
      # lock trails one line behind from the moment a release lands: the next
      # `uv run` in any clone rewrites it and dirties the tree, and every branch
      # cut afterwards carries the fix as unrelated noise. Re-locking here puts
      # the bump and its lock in the same PR, so they merge together.
      #
      # A no-op in the Go, Rust and TypeScript repos that share this workflow --
      # the steps are skipped when the release PR has no uv.lock.
      #
      # Every fromJSON below is guarded with `|| '{}'`, and the guard is
      # load-bearing rather than defensive. `pr` is an empty string on any push
      # that does not cut a release PR, which is most pushes to main, and
      # fromJSON('') fails the job with "Error reading JToken from JsonReader.
      # Path '', line 0, position 0" attributed to this file.
      #
      # An `if:` does not protect against it. Observed: with prs_created false,
      # the setup-uv step and the uv.lock step carry the identical condition
      # `steps.uv.outputs.present == 'true'`, yet setup-uv skipped and the
      # uv.lock step *failed* -- the only difference between them being that the
      # latter has a step-level `env:`, which is evaluated before the condition.
      # `with:` is evaluated after it, which is why the checkout step skipped
      # cleanly despite holding the same expression. Guard both anyway: the
      # distinction is invisible at the call site and does not survive someone
      # moving an expression from one block to the other.
      # ('' is falsy in GitHub expressions, so `pr || '{}'` yields '{}', and
      # fromJSON('{}').headBranchName is null, i.e. an empty string.)
      - name: Check out the release PR branch
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}

      - name: Look for a uv project
        id: uv
        if: steps.rp.outputs.prs_created == 'true'
        run: echo "present=${{ hashFiles('uv.lock') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        if: steps.uv.outputs.present == 'true'

      - name: Sync uv.lock with the released version
        if: steps.uv.outputs.present == 'true'
        env:
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the released version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with the released version"
          # release-please force-pushes this branch whenever it refreshes the PR,
          # which drops this commit. That is harmless: this step runs after every
          # such refresh and simply re-applies it.
          git push origin "HEAD:$BRANCH"
